<!DOCTYPE html>
<html lang="id" data-skin="arcade">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan Bulanan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1EC;--card:#FAFBF8;--ink:#17261F;--mute:#5E6D65;--line:#D5DCD3;--in:#1B7F5C;--out:#C23B58;--save:#2D5DB8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101714;--card:#18211C;--ink:#E6EEE8;--mute:#93A39A;--line:#2A3730;--in:#4CC79A;--out:#F0728C;--save:#7FA6F2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101714;--card:#18211C;--ink:#E6EEE8;--mute:#93A39A;--line:#2A3730;--in:#4CC79A;--out:#F0728C;--save:#7FA6F2;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:1.05rem;font-weight:600;margin:0 0 12px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:8px}
.nav b{min-width:150px;text-align:center;font-weight:600;text-transform:capitalize}
button,input,select{font:inherit;color:inherit}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.hero .lbl{color:var(--mute);margin:0}
.big{font-size:clamp(2.3rem,9vw,4rem);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.big.neg{color:var(--out)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;color:var(--mute);font-size:.88rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat{border-left:4px solid var(--c);padding:14px 16px}
.stat p{margin:0;color:var(--mute);font-size:.9rem}
.stat strong{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
form{display:grid;gap:10px}
label{display:grid;gap:4px;font-size:.88rem;color:var(--mute)}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--save);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{margin:0;position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:9px 4px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:.9rem}
.seg input:checked+span{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--save);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--card);font-weight:600;cursor:pointer}
.cat{display:grid;gap:12px}
.cat div p{display:flex;justify-content:space-between;gap:8px;margin:0 0 4px;font-size:.93rem}
.cat span.t{height:8px;border-radius:4px;background:var(--line);display:block;overflow:hidden}
.cat span.t i{display:block;height:100%;background:var(--out);border-radius:4px}
.scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:560px;height:auto}
.bi{fill:var(--in)}.bo{fill:var(--out)}
svg text{fill:var(--mute);font-size:10px;font-family:inherit}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:520px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:.93rem}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--mute)}
tfoot td{font-weight:800;border-bottom:0}
.tx{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx time{color:var(--mute);font-size:.88rem;min-width:52px}
.tx small{display:block;color:var(--mute)}
.tx b{font-variant-numeric:tabular-nums}
.tx .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:8px}
.empty{color:var(--mute);margin:0}
.empty button{margin-top:10px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.pos{color:var(--in)}.min{color:var(--out)}.sv{color:var(--save)}
.sub{display:none}.sub.show{display:grid}
.lnk{background:none;border:0;padding:0;text-align:left;color:var(--out);font-size:.88rem;text-decoration:underline;cursor:pointer}.lnk[hidden]{display:none}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
/* ---- Tampilan baru ---- */
body{min-height:100vh;background:radial-gradient(620px 320px at 92% -4%,color-mix(in srgb,var(--save) 20%,transparent),transparent),radial-gradient(520px 300px at -6% 28%,color-mix(in srgb,var(--in) 18%,transparent),transparent),radial-gradient(520px 300px at 100% 80%,color-mix(in srgb,var(--out) 12%,transparent),transparent),var(--bg)}
h1{font-size:1.9rem}
h1::before{content:"\1F4B0";margin-right:8px}
.card{border-radius:20px;box-shadow:0 10px 24px -14px rgba(10,40,28,.35)}
.nav{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 6px 16px -10px rgba(10,40,28,.4)}
.ib{border:0;background:transparent;transition:background .15s,transform .1s}
.ib:hover{background:var(--bg)}
button{transition:transform .1s,filter .15s}
button:active{transform:scale(.93)}
.hero{position:relative;overflow:hidden;border:0;color:#fff;padding:22px 22px 20px;background:linear-gradient(135deg,#0B4F3B 0%,#1B7F5C 55%,#2A8FA0 100%);--out:#FF8FA3;--save:#9CC0FF;--in:#7CF0C0}
.hero .lbl{color:rgba(255,255,255,.82);padding-right:64px}
.hero .big{margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.2)}
.hero .big.neg{color:#FFD1DA}
.hero .split{background:rgba(255,255,255,.22);height:16px;border-radius:8px}
.hero .legend{color:rgba(255,255,255,.88)}
.hero::after{content:"Rp";position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;color:#7A5200;background:radial-gradient(circle at 35% 30%,#FFF0A8,#F5BE2B 62%,#C98A00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 6px 14px -4px rgba(0,0,0,.4)}
.hero.pop::after{animation:flip .85s ease-out}
@keyframes flip{0%{transform:rotateY(0) translateY(0)}40%{transform:rotateY(360deg) translateY(-10px)}100%{transform:rotateY(720deg) translateY(0)}}
.stat{border:1px solid color-mix(in srgb,var(--c) 32%,var(--line));border-left:1px solid color-mix(in srgb,var(--c) 32%,var(--line));background:color-mix(in srgb,var(--c) 11%,var(--card))}
.stat strong{color:var(--c)}
.stats .stat:nth-child(1)>p:first-child::before{content:"\1F4B5  "}
.stats .stat:nth-child(2)>p:first-child::before{content:"\1F6D2  "}
.stats .stat:nth-child(3)>p:first-child::before{content:"\1F437  "}
.seg span{border-radius:12px;transition:transform .12s,background .15s}
.seg label:hover span{background:var(--bg)}
.seg input:checked+span{transform:scale(1.03);box-shadow:0 8px 16px -8px var(--c)}
input:focus,select:focus{border-color:var(--in)}
.go{padding:14px;color:#fff;font-size:1.02rem;border-radius:14px;background:linear-gradient(135deg,#1B7F5C,#2A8FA0);box-shadow:0 12px 22px -12px #1B7F5C}
.go:hover{filter:brightness(1.08)}
.cat div:nth-child(5n+1) i{background:#E0506E}.cat div:nth-child(5n+2) i{background:#F08A3C}.cat div:nth-child(5n+3) i{background:#E2B42A}.cat div:nth-child(5n+4) i{background:#8A5CD6}.cat div:nth-child(5n+5) i{background:#2D9CB0}
.cat span.t{height:10px;border-radius:5px}
tfoot tr{background:color-mix(in srgb,var(--in) 14%,transparent)}
.tx time{background:var(--bg);border-radius:8px;padding:3px 8px;text-align:center}
.tx{border-radius:10px}
.tx:hover{background:color-mix(in srgb,var(--in) 7%,transparent)}
#sndbtn{margin-left:2px}
@media (prefers-reduced-motion:reduce){.hero.pop::after{animation:none}button:active{transform:none}}
/* ---- Tema berwarna ---- */
:root[data-skin="arcade"]{--bg:#140A2E;--card:#201249;--ink:#F6F0FF;--mute:#B2A4D9;--line:#3A2A78;--in:#3DFFB0;--out:#FF4F93;--save:#52C7FF;--glow:#B26BFF;--bt:#04131C;--hg:linear-gradient(135deg,#5A12E8 0%,#B22FF2 50%,#F2418A 100%);color-scheme:dark}
:root[data-skin="sakura"]{--bg:#FFF1F6;--card:#FFFFFF;--ink:#4B1D36;--mute:#8F6377;--line:#F6CFDD;--in:#0F9E78;--out:#E0356A;--save:#6C5CE7;--glow:#FF7EB0;--bt:#FFFFFF;--hg:linear-gradient(135deg,#E83E78 0%,#F5688F 50%,#FF9A6E 100%);color-scheme:light}
:root[data-skin="samudra"]{--bg:#06182B;--card:#0B2A47;--ink:#E7F6FF;--mute:#8FB4CC;--line:#17476E;--in:#2CF2C0;--out:#FF7A8A;--save:#5CB8FF;--glow:#2CC8FF;--bt:#04131C;--hg:linear-gradient(135deg,#0A4C92 0%,#0E8FB8 55%,#17BFA0 100%);color-scheme:dark}
:root[data-skin="sunset"]{--bg:#FFF4E5;--card:#FFFFFF;--ink:#3B2118;--mute:#8A6A58;--line:#F6D9B8;--in:#12945F;--out:#D9342B;--save:#7A4CE0;--glow:#FF9A3C;--bt:#FFFFFF;--hg:linear-gradient(135deg,#D92B3A 0%,#F2602F 55%,#EE8A1F 100%);color-scheme:light}
body{font-family:"Fredoka","Bricolage Grotesque",system-ui,sans-serif;background:radial-gradient(color-mix(in srgb,var(--ink) 10%,transparent) 1.3px,transparent 1.4px) 0 0/26px 26px,radial-gradient(640px 340px at 92% -4%,color-mix(in srgb,var(--glow) 28%,transparent),transparent),radial-gradient(520px 320px at -6% 30%,color-mix(in srgb,var(--in) 20%,transparent),transparent),radial-gradient(520px 300px at 100% 85%,color-mix(in srgb,var(--out) 16%,transparent),transparent),var(--bg)}
h1{font-size:2rem;font-weight:700;background:linear-gradient(90deg,var(--in),var(--save),var(--out));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h1::before{content:none}
.card{border:1px solid color-mix(in srgb,var(--glow) 40%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--glow) 10%,transparent),0 16px 32px -18px var(--glow)}
.hero{background:var(--hg);border:0;box-shadow:0 18px 40px -16px var(--glow)}
.stat{border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));background:color-mix(in srgb,var(--c) 14%,var(--card))}
.nav{border-color:color-mix(in srgb,var(--glow) 45%,var(--line));box-shadow:0 8px 20px -10px var(--glow)}
input,select{background:color-mix(in srgb,var(--ink) 6%,var(--card))}
.seg input:checked+span{color:var(--bt)}
.go{color:var(--bt);font-weight:700;background:linear-gradient(135deg,var(--in),var(--save));box-shadow:0 14px 26px -12px var(--glow)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;animation:tin .25s ease-out;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.conf{position:fixed;z-index:60;pointer-events:none;font-size:1.4rem;margin:-10px 0 0 -10px}
:root[data-skin="galaksi"]{--bg:#0A0B1E;--card:#14163A;--ink:#EEF0FF;--mute:#9AA0D6;--line:#2B2F6B;--in:#7DF9C5;--out:#FF6B9D;--save:#FFD166;--glow:#7C83FF;--bt:#07091C;--hg:linear-gradient(135deg,#1B1F8F 0%,#6A2BD9 55%,#B84DF0 100%);color-scheme:dark}
:root[data-skin="matcha"]{--bg:#F1F7EC;--card:#FFFFFF;--ink:#20361F;--mute:#6B8466;--line:#D2E4C6;--in:#2E9E4E;--out:#D8473C;--save:#3B7DD8;--glow:#7BC96F;--bt:#FFFFFF;--hg:linear-gradient(135deg,#25683A 0%,#3E9150 55%,#76AE45 100%);color-scheme:light}
:root[data-skin="boba"]{--bg:#F6F0FF;--card:#FFFFFF;--ink:#3A2660;--mute:#7E6BA6;--line:#E0D2F7;--in:#1FA67A;--out:#E34E8A;--save:#7F5AF0;--glow:#B392FF;--bt:#FFFFFF;--hg:linear-gradient(135deg,#6F48E0 0%,#A06AF0 55%,#E479BC 100%);color-scheme:light}
:root[data-skin="emas"]{--bg:#14100A;--card:#1F1910;--ink:#FBF1D9;--mute:#BFA878;--line:#4A3B1E;--in:#8BE28B;--out:#FF7A66;--save:#F5C14B;--glow:#F5B52E;--bt:#1A1203;--hg:linear-gradient(135deg,#6B4300 0%,#B87A0A 55%,#D9A02A 100%);color-scheme:dark}
:root[data-skin="cyber"]{--bg:#07090F;--card:#0E1520;--ink:#E8FBFF;--mute:#7FA3B3;--line:#1C3A4A;--in:#00F5A0;--out:#FF2E7E;--save:#00D4FF;--glow:#FFE600;--bt:#03080C;--hg:linear-gradient(135deg,#0B1F3A 0%,#0A6C8F 50%,#E0225F 100%);color-scheme:dark}
:root[data-skin="permen"]{--bg:#FFFBE6;--card:#FFFFFF;--ink:#3D2A5C;--mute:#86719B;--line:#FFE3A3;--in:#19A974;--out:#FF4E6A;--save:#3D8BFF;--glow:#FFC93C;--bt:#FFFFFF;--hg:linear-gradient(135deg,#F0307A 0%,#F96E3A 50%,#EE9A1A 100%);color-scheme:light}
.sync{margin:-6px 0 0;font-size:.85rem;color:var(--mute)}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Catatan Keuangan</h1>
    <div class="nav">
      <button class="ib" id="prev" aria-label="Bulan sebelumnya">‹</button>
      <b id="mlabel"></b>
      <button class="ib" id="next" aria-label="Bulan berikutnya">›</button>
      <button class="ib" id="skinbtn" aria-label="Ganti tema" title="Ganti tema">🎨</button>
      <button class="ib" id="sndbtn" aria-label="Suara" aria-pressed="true">🔊</button>
    </div>
  </header>

  <p class="sync" id="sync"></p>
  <section class="card hero" id="hero"></section>
  <section class="stats" id="stats"></section>

  <div class="cols">
    <section class="card">
      <h2>Catat transaksi</h2>
      <form id="f">
        <div class="seg" role="radiogroup" aria-label="Jenis transaksi">
          <label style="--c:var(--in)"><input type="radio" name="type" value="in" checked><span>Pemasukan</span></label>
          <label style="--c:var(--out)"><input type="radio" name="type" value="out"><span>Pengeluaran</span></label>
          <label style="--c:var(--save)"><input type="radio" name="type" value="save"><span>Tabungan</span></label>
        </div>
        <div class="row2">
          <label>Tanggal<input type="date" id="date" required></label>
          <label>Kategori<select id="cat"></select></label>
        </div>
        <label class="sub" id="newwrap">Nama kategori baru<input type="text" id="newcat" maxlength="24" placeholder="Contoh: Parkir, Jajan, Uang dari mamah"></label>
        <button type="button" class="lnk" id="delcat" hidden>Hapus kategori ini (transaksi lama tetap ada)</button>
        <label>Jumlah<input type="text" id="amt" inputmode="numeric" autocomplete="off" placeholder="Contoh: Rp 50.000" required></label>
        <label>Catatan (opsional)<input type="text" id="note" maxlength="60" placeholder="Contoh: makan siang"></label>
        <button class="go" type="submit">Simpan transaksi</button>
      </form>
    </section>
    <section class="card">
      <h2>Pengeluaran per kategori</h2>
      <div class="cat" id="catlist"></div>
    </section>
  </div>

  <section class="card">
    <h2>Per hari</h2>
    <div class="scroll" id="daily"></div>
  </section>
  <section class="card">
    <h2>Rekap per minggu</h2>
    <div class="scroll" id="weekly"></div>
  </section>
  <section class="card">
    <h2>Riwayat transaksi</h2>
    <div id="list"></div>
  </section>
</main>

<script>
const KEY = 'keuangan:v1';
const CATS = {
  in: ['Gaji', 'Usaha', 'Bonus', 'Lainnya'],
  out: ['Makan', 'Transport', 'Tagihan', 'Belanja', 'Hiburan', 'Kesehatan', 'Lainnya'],
  save: ['Tabungan', 'Dana darurat', 'Investasi', 'Lainnya']
};
const NAME = { in: 'Pemasukan', out: 'Pengeluaran', save: 'Tabungan' };
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const nf = new Intl.NumberFormat('id-ID');
const rp = n => (n < 0 ? '−' : '') + 'Rp\u00A0' + nf.format(Math.abs(Math.round(n)));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(tx)); } catch (e) {}
  pushCloud();
}

let tx = load();
const now = new Date();
let ym = now.getFullYear() + '-' + pad(now.getMonth() + 1);

function sum(list, type) {
  return list.filter(t => t.type === type).reduce((a, t) => a + t.amt, 0);
}

function render() {
  const [y, m] = ym.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  $('mlabel').textContent = new Date(y, m - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  const list = tx.filter(t => t.date.startsWith(ym));
  const inc = sum(list, 'in'), out = sum(list, 'out'), sav = sum(list, 'save');
  const net = inc - out - sav;
  const pct = v => inc > 0 ? Math.round(v / inc * 100) : 0;

  // Ringkasan utama
  const w = v => inc > 0 ? Math.max(0, Math.min(100, v / inc * 100)) : 0;
  const rest = Math.max(0, net);
  $('hero').innerHTML =
    '<p class="lbl">Saldo bersih bulan ini</p>' +
    '<div class="big' + (net < 0 ? ' neg' : '') + '" data-v="' + net + '">' + rp(net) + '</div>' +
    '<div class="split" role="img" aria-label="Pembagian pemasukan">' +
      '<i style="width:' + w(out) + '%;background:var(--out)"></i>' +
      '<i style="width:' + w(sav) + '%;background:var(--save)"></i>' +
      '<i style="width:' + w(rest) + '%;background:var(--in)"></i></div>' +
    '<div class="legend">' +
      '<span><span class="dot" style="background:var(--out)"></span>Pengeluaran ' + pct(out) + '%</span>' +
      '<span><span class="dot" style="background:var(--save)"></span>Tabungan ' + pct(sav) + '%</span>' +
      '<span><span class="dot" style="background:var(--in)"></span>Sisa ' + pct(rest) + '%</span></div>' +
    '<p class="lbl" style="margin-top:10px;font-size:.88rem">Saldo bersih = pemasukan − pengeluaran − tabungan.</p>';

  const card = (c, label, v, note) =>
    '<div class="card stat" style="--c:' + c + '"><p>' + label + '</p><strong>' + rp(v) + '</strong><p>' + note + '</p></div>';
  $('stats').innerHTML =
    card('var(--in)', 'Pemasukan', inc, list.filter(t => t.type === 'in').length + ' transaksi') +
    card('var(--out)', 'Pengeluaran', out, pct(out) + '% dari pemasukan') +
    card('var(--save)', 'Tabungan', sav, pct(sav) + '% dari pemasukan');

  // Kategori pengeluaran
  const byCat = {};
  list.filter(t => t.type === 'out').forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amt);
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  $('catlist').innerHTML = cats.length ? cats.map(([c, v]) =>
    '<div><p><span>' + esc(c) + '</span><b>' + rp(v) + ' · ' + Math.round(v / out * 100) + '%</b></p>' +
    '<span class="t"><i style="width:' + (v / out * 100) + '%"></i></span></div>').join('')
    : '<p class="empty">Belum ada pengeluaran bulan ini.</p>';

  // Grafik harian
  const di = Array(days + 1).fill(0), dOut = Array(days + 1).fill(0);
  list.forEach(t => {
    const d = Number(t.date.slice(8, 10));
    if (t.type === 'in') di[d] += t.amt; else if (t.type === 'out') dOut[d] += t.amt;
  });
  const mx = Math.max(1, ...di, ...dOut);
  const W = 640, H = 170, bw = W / days, ch = H - 22;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik pemasukan dan pengeluaran harian">';
  svg += '<line x1="0" x2="' + W + '" y1="' + ch + '" y2="' + ch + '" stroke="var(--line)"/>';
  for (let d = 1; d <= days; d++) {
    const x = (d - 1) * bw, a = di[d] / mx * (ch - 6), b = dOut[d] / mx * (ch - 6);
    if (a > 0) svg += '<rect class="bi" x="' + (x + bw * .1) + '" y="' + (ch - a) + '" width="' + bw * .38 + '" height="' + a + '" rx="2"><title>Tgl ' + d + ' pemasukan ' + rp(di[d]) + '</title></rect>';
    if (b > 0) svg += '<rect class="bo" x="' + (x + bw * .52) + '" y="' + (ch - b) + '" width="' + bw * .38 + '" height="' + b + '" rx="2"><title>Tgl ' + d + ' pengeluaran ' + rp(dOut[d]) + '</title></rect>';
    if (d === 1 || d % 5 === 0 || d === days) svg += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + d + '</text>';
  }
  $('daily').innerHTML = svg + '</svg>' +
    '<div class="legend"><span><span class="dot" style="background:var(--in)"></span>Pemasukan</span><span><span class="dot" style="background:var(--out)"></span>Pengeluaran</span></div>';

  // Rekap mingguan
  const weeks = Math.ceil(days / 7);
  let rows = '';
  for (let k = 1; k <= weeks; k++) {
    const wl = list.filter(t => Math.ceil(Number(t.date.slice(8, 10)) / 7) === k);
    const a = sum(wl, 'in'), b = sum(wl, 'out'), c = sum(wl, 'save'), n = a - b - c;
    const s = (k - 1) * 7 + 1, e = Math.min(k * 7, days);
    rows += '<tr><td>Minggu ' + k + ' (tgl ' + s + '–' + e + ')</td><td class="pos">' + rp(a) + '</td><td class="min">' + rp(b) + '</td><td class="sv">' + rp(c) + '</td><td>' + rp(n) + '</td></tr>';
  }
  $('weekly').innerHTML = '<table><thead><tr><th>Periode</th><th>Pemasukan</th><th>Pengeluaran</th><th>Tabungan</th><th>Saldo bersih</th></tr></thead><tbody>' + rows +
    '</tbody><tfoot><tr><td>Total bulan ini</td><td class="pos">' + rp(inc) + '</td><td class="min">' + rp(out) + '</td><td class="sv">' + rp(sav) + '</td><td>' + rp(net) + '</td></tr></tfoot></table>';

  // Riwayat
  const sorted = list.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $('list').innerHTML = sorted.length ? sorted.map(t => {
    const cls = t.type === 'in' ? 'pos' : t.type === 'out' ? 'min' : 'sv';
    const sign = t.type === 'in' ? '+' : '−';
    return '<div class="tx"><time>' + t.date.slice(8, 10) + '/' + t.date.slice(5, 7) + '</time>' +
      '<div>' + esc(t.cat) + ' <small>' + NAME[t.type] + (t.note ? ' · ' + esc(t.note) : '') + '</small></div>' +
      '<b class="' + cls + '">' + sign + rp(t.amt) + '</b>' +
      '<button class="x" data-id="' + t.id + '" aria-label="Hapus transaksi">✕</button></div>';
  }).join('') :
    '<p class="empty">Belum ada transaksi di bulan ini. Isi formulir di atas untuk mulai mencatat.' +
    '<br><button id="demo" type="button">Muat data contoh</button></p>';
}

const NEWCAT = '__new__';
function loadCustom() {
  try { const v = JSON.parse(localStorage.getItem('keuangan:cats:v1')); return v && typeof v === 'object' ? v : {}; }
  catch (e) { return {}; }
}
let custom = loadCustom();
function saveCustom() {
  try { localStorage.setItem('keuangan:cats:v1', JSON.stringify(custom)); } catch (e) {}
  pushCloud();
}
function curType() { return document.querySelector('input[name=type]:checked').value; }
function catsOf(type) { return CATS[type].concat(custom[type] || []); }
function fillCats(sel) {
  $('cat').innerHTML = catsOf(curType()).map(c => '<option>' + esc(c) + '</option>').join('') +
    '<option value="' + NEWCAT + '">＋ Kategori baru…</option>';
  if (sel) $('cat').value = sel;
  catChange();
}
function catChange() {
  const isNew = $('cat').value === NEWCAT;
  $('newwrap').classList.toggle('show', isNew);
  $('newcat').required = isNew;
  $('delcat').hidden = !(custom[curType()] || []).includes($('cat').value);
}
function setDate() {
  const [y, m] = ym.split('-').map(Number);
  const isNow = y === now.getFullYear() && m === now.getMonth() + 1;
  $('date').value = ym + '-' + pad(isNow ? now.getDate() : 1);
  $('date').min = ym + '-01';
  $('date').max = ym + '-' + pad(new Date(y, m, 0).getDate());
}
function shift(n) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  ym = d.getFullYear() + '-' + pad(d.getMonth() + 1);
  setDate(); render();
}

document.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', () => fillCats()));
$('cat').addEventListener('change', catChange);
$('delcat').onclick = () => {
  const t = curType(), c = $('cat').value;
  custom[t] = (custom[t] || []).filter(x => x !== c);
  saveCustom(); fillCats();
};
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const amt = Number($('amt').value.replace(/\D/g, ''));
  if (!(amt > 0)) return;
  const typ = curType();
  let cat = $('cat').value;
  if (cat === NEWCAT) {
    cat = $('newcat').value.trim().replace(/\s+/g, ' ');
    if (!cat) { $('newcat').focus(); return; }
    const ada = catsOf(typ).find(c => c.toLowerCase() === cat.toLowerCase());
    if (ada) cat = ada;
    else { (custom[typ] = custom[typ] || []).push(cat); saveCustom(); }
  }
  tx.push({
    id: Date.now(), date: $('date').value,
    type: document.querySelector('input[name=type]:checked').value,
    cat: cat, amt: amt, note: $('note').value.trim()
  });
  persist();
  $('amt').value = ''; $('note').value = ''; $('newcat').value = ''; fillCats(cat); sfx(typ); flipCoin(); burst(typ);
  render();
});
document.addEventListener('click', e => {
  const x = e.target.closest('.x');
  if (x) { tx = tx.filter(t => String(t.id) !== x.dataset.id); persist(); render(); sfx('del'); }
  if (e.target.id === 'demo') {
    const d = n => ym + '-' + pad(n);
    const base = Date.now();
    [
      ['in', 'Gaji', 5000000, 1, 'Gaji bulanan'], ['in', 'Usaha', 750000, 12, 'Jualan online'],
      ['out', 'Tagihan', 600000, 3, 'Listrik dan internet'], ['out', 'Makan', 45000, 4, 'Makan siang'],
      ['out', 'Transport', 120000, 8, 'Bensin'], ['out', 'Belanja', 350000, 10, 'Kebutuhan rumah'],
      ['out', 'Makan', 180000, 15, 'Makan keluarga'], ['out', 'Hiburan', 100000, 22, 'Nonton'],
      ['save', 'Tabungan', 1000000, 2, 'Tabungan bulanan'], ['save', 'Dana darurat', 300000, 16, '']
    ].forEach((r, i) => tx.push({ id: base + i, date: d(r[3]), type: r[0], cat: r[1], amt: r[2], note: r[4] }));
    persist(); render(); sfx('save'); flipCoin(); burst('save');
  }
});

/* ---- Suara (Web Audio, tanpa file) ---- */
let cloud = null, pushT = null, pushing = false, again = false;
let sndOn = true;
try { sndOn = localStorage.getItem('keuangan:sound') !== '0'; } catch (e) {}
let actx;
function tone(f, t0, d, type, vol, f2) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + d + 0.03);
}
function sfx(name) {
  if (!sndOn) return;
  try {
    ensure();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    if (name === 'tap') tone(480, t, .09, 'sine', .14, 1000);
    else if (name === 'in') { [1319, 1568, 2093].forEach((f, i) => bell(f, t + i * .07, .5, .16)); tone(220, t, .08, 'square', .05, 110); }
    else if (name === 'out') { tone(700, t, .35, 'sawtooth', .07, 140); bell(330, t + .12, .4, .12); }
    else if (name === 'save') { [523, 659, 784, 1047, 1319].forEach((f, i) => bell(f, t + i * .09, .6, .16)); [523, 659, 784].forEach(f => tone(f, t + .5, .8, 'triangle', .08)); }
    else if (name === 'del') { tone(880, t, .16, 'sine', .12, 440); bell(392, t + .1, .3, .09); }
    else if (name === 'skin') [784, 988, 1175, 1568].forEach((f, i) => bell(f, t + i * .06, .4, .12));
  } catch (e) {}
}
function setSnd(on) {
  sndOn = on;
  $('sndbtn').textContent = on ? '\uD83D\uDD0A' : '\uD83D\uDD07';
  $('sndbtn').setAttribute('aria-pressed', on);
  try { localStorage.setItem('keuangan:sound', on ? '1' : '0'); } catch (e) {}
}
$('sndbtn').onclick = () => { const was = sndOn; setSnd(!was); pushCloud(); if (!was) sfx('tap'); };
setSnd(sndOn);
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && !b.classList.contains('go') && !b.classList.contains('x') && b.id !== 'demo' && b.id !== 'sndbtn' && b.id !== 'skinbtn') sfx('tap');
});
document.addEventListener('change', e => {
  if (e.target.matches('select, input[type=radio]')) sfx('tap');
});
function flipCoin() {
  const h = $('hero');
  h.classList.remove('pop'); void h.offsetWidth; h.classList.add('pop');
}

/* ---- Angka saldo berjalan naik/turun ---- */
let shownNet = 0;
function animateNet() {
  const el = document.querySelector('.big');
  if (!el) return;
  const to = Number(el.dataset.v), from = shownNet;
  shownNet = to;
  if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t0 = performance.now(), dur = 700;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = rp(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
const baseRender = render;
render = function () { baseRender(); animateNet(); };

$('amt').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 12);
  e.target.value = d ? 'Rp\u00A0' + nf.format(Number(d)) : '';
});

/* ---- Suara lebih kaya: bel + gema ---- */
let master;
function ensure() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = .9; master.connect(actx.destination);
  const dl = actx.createDelay(), fb = actx.createGain(), wet = actx.createGain();
  dl.delayTime.value = .17; fb.gain.value = .3; wet.gain.value = .28;
  master.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(actx.destination);
}
function bell(f, t0, d, vol) {
  tone(f, t0, d, 'sine', vol);
  tone(f * 2.76, t0, d * .5, 'sine', vol * .35);
}

/* ---- Ganti tema ---- */
const SKINS = [['arcade', 'Arcade 🕹️'], ['sakura', 'Sakura 🌸'], ['samudra', 'Samudra 🌊'], ['galaksi', 'Galaksi 🌌'], ['matcha', 'Matcha 🍵'], ['boba', 'Boba 🧋'], ['emas', 'Emas 👑'], ['cyber', 'Cyber 🤖'], ['permen', 'Permen 🍭'], ['sunset', 'Sunset 🌅']];
let skin = 'arcade';
try { skin = localStorage.getItem('keuangan:skin') || 'arcade'; } catch (e) {}
function toast(m) {
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = m; document.body.appendChild(d);
  setTimeout(() => d.remove(), 1800);
}
function setSkin(s, say) {
  if (!SKINS.some(k => k[0] === s)) s = 'arcade';
  skin = s; document.documentElement.dataset.skin = s;
  try { localStorage.setItem('keuangan:skin', s); } catch (e) {}
  if (say) { toast('Tema ' + SKINS.find(k => k[0] === s)[1]); sfx('skin'); pushCloud(); }
}
$('skinbtn').onclick = () => setSkin(SKINS[(SKINS.findIndex(k => k[0] === skin) + 1) % SKINS.length][0], true);
setSkin(skin);

/* ---- Hujan emoji saat menyimpan ---- */
function burst(type) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const em = { in: ['🪙', '💸', '✨'], out: ['💨', '🧾', '💦'], save: ['🐷', '⭐', '✨', '🪙'] }[type] || ['✨'];
  const r = $('hero').getBoundingClientRect();
  const x0 = Math.min(innerWidth - 20, Math.max(20, r.right - 40)), y0 = Math.max(70, r.top + 40);
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span');
    s.className = 'conf'; s.textContent = em[i % em.length];
    s.style.left = x0 + 'px'; s.style.top = y0 + 'px';
    document.body.appendChild(s);
    const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 170;
    s.animate([
      { transform: 'translate(0,0) scale(.4)', opacity: 1 },
      { transform: 'translate(' + Math.cos(a) * v + 'px,' + (Math.sin(a) * v - 60) + 'px) scale(1.1) rotate(' + Math.round(Math.random() * 360) + 'deg)', opacity: 1, offset: .6 },
      { transform: 'translate(' + Math.cos(a) * v * 1.1 + 'px,' + (Math.sin(a) * v + 140) + 'px) scale(.8)', opacity: 0 }
    ], { duration: 1100 + Math.random() * 500, easing: 'ease-out' }).onfinish = () => s.remove();
  }
}

fillCats(); setDate(); render();

/* ---- Simpan progres otomatis (akun + browser) ---- */
function setSync(m) {
  $('sync').textContent = m === 'cloud'
    ? '☁️ Progres tersimpan otomatis di akun Anda dan bisa dibuka di perangkat lain.'
    : '💾 Progres tersimpan di browser ini.';
}
function pushCloud() {
  if (!cloud) return;
  clearTimeout(pushT);
  pushT = setTimeout(doPush, 400);
}
async function doPush() {
  if (!cloud) return;
  if (pushing) { again = true; return; }
  pushing = true;
  try { await cloud.set({ tx: tx, custom: custom, skin: skin, sound: sndOn, updated: Date.now() }); setSync('cloud'); }
  catch (e) { setSync('local'); }
  pushing = false;
  if (again) { again = false; doPush(); }
}
async function initCloud() {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/state');
    const snap = await ref.get();
    const d = snap.exists ? snap.data() : null;
    if (d && Array.isArray(d.tx)) {
      tx = d.tx.slice();
      custom = d.custom && typeof d.custom === 'object' ? d.custom : {};
      try { localStorage.setItem(KEY, JSON.stringify(tx)); } catch (e) {}
      saveCustom();
      if (typeof d.skin === 'string') setSkin(d.skin);
      if (typeof d.sound === 'boolean') setSnd(d.sound);
      cloud = ref;
      fillCats(); render();
      setSync('cloud');
    } else {
      cloud = ref;
      doPush();
    }
  } catch (e) { setSync('local'); }
}
setSync('local');
initCloud();
</script>
